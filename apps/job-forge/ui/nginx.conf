# El panel se sirve como ficheros estáticos y nada más. No proxifica /api ni
# /ws: de eso se encarga el Ingress, que es donde F7 va a poner el rate limiting
# del endpoint público. Duplicar el enrutado aquí dejaría dos sitios donde
# equivocarse y uno de ellos sin protección.

worker_processes auto;
error_log /dev/stderr warn;

# Con readOnlyRootFilesystem nginx no puede escribir en ninguna de sus rutas de
# trabajo por defecto. Todas se redirigen a /tmp, que el chart monta como
# emptyDir. Si falta cualquiera de estas líneas el contenedor arranca y muere
# con un "permission denied" que no dice de qué directorio habla.
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  access_log    /dev/stdout;

  client_body_temp_path /tmp/client_body;
  proxy_temp_path       /tmp/proxy;
  fastcgi_temp_path     /tmp/fastcgi;
  uwsgi_temp_path       /tmp/uwsgi;
  scgi_temp_path        /tmp/scgi;

  sendfile      on;
  tcp_nopush    on;
  server_tokens off;

  gzip              on;
  gzip_min_length   1024;
  gzip_types        text/css application/javascript application/json image/svg+xml;

  server {
    # 8080 y no 80: un puerto por debajo de 1024 exige la capability NET_BIND_SERVICE,
    # y el chart las suelta todas.
    listen      8080;
    server_name _;
    root        /usr/share/nginx/html;

    # El panel es una SPA: una recarga en una ruta interna llega aquí como un
    # fichero que no existe. Sin este try_files, F5 devuelve 404 en cualquier
    # sitio que no sea la raíz.
    location / {
      try_files $uri $uri/ /index.html;
    }

    # Los bundles llevan hash en el nombre, así que se pueden cachear para
    # siempre. index.html no: es quien dice qué hash toca hoy.
    location = /index.html {
      add_header Cache-Control "no-cache";
    }

    location ~* \.(?:js|css|woff2?|png|svg|ico)$ {
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Sonda del contenedor. No mide nada del backend a propósito: este pod sirve
    # ficheros, y su salud no depende de que RabbitMQ esté vivo.
    location = /healthz {
      access_log off;
      add_header Content-Type text/plain;
      return 200 "ok\n";
    }
  }
}
