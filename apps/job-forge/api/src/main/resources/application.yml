spring:
  application:
    name: job-forge-api

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:29092}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      # El panel enseña lo que pasa ahora, no la historia entera: quien abre la
      # página no quiere ver el log completo desfilando.
      auto-offset-reset: latest
      properties:
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.eventlab.jobforge.contracts.audit.JobEvent

  servlet:
    multipart:
      # El panel es público: el tope de tamaño es la primera barrera, antes
      # incluso de contar tareas. El rate limiting de verdad llega en F7.
      max-file-size: 256KB
      max-request-size: 512KB

  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  metrics:
    tags:
      application: job-forge-api

job-forge:
  panel:
    max-sessions: 50
    snapshot-interval: 1s
  api:
    max-tasks-per-job: 200
    max-payload-length: 512
    max-reprocess-batch: 50

logging:
  level:
    com.eventlab.jobforge: INFO
