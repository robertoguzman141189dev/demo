# Values de job-forge para el cluster local de kind.
#
# Lo único que distingue un entorno de otro vive en archivos como este (ADR 002).
# El de prod nace en F6, cuando exista un registro al que apuntar y un pipeline
# que escriba el tag.

image:
  # Sin registro: las imágenes se construyen en tu máquina y se cargan en el nodo
  # de kind con `kind load docker-image`. No hay nada que descargar.
  registry: ""
  # Never y no IfNotPresent: si el tag no estuviera en el nodo, IfNotPresent
  # intentaría bajarlo de Docker Hub y fallaría con un ImagePullBackOff confuso.
  # Con Never el error dice exactamente lo que pasa: la imagen no está cargada.
  pullPolicy: Never

# En local el tag es fijo. En prod lo escribe el pipeline con el SHA del commit y
# nunca se repite.
# Los recursos de aquí abajo son MÁS PEQUEÑOS que los del chart a propósito.
# Los valores por defecto describen lo que estos servicios necesitan de verdad;
# estos describen lo que cabe en un portátil que además tiene abierto un IDE y un
# navegador. Es exactamente para lo que existen los values por entorno.
#
# No se tocan los límites de CPU: lo que aprieta en local es la memoria.

api:
  image:
    tag: dev
  resources:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      cpu: "1"
      memory: 384Mi

worker:
  image:
    tag: dev
  # Dos réplicas y no una: con una sola no se ve competir a los consumidores por
  # la misma cola, que es media tesis del demo.
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      cpu: "1"
      memory: 384Mi

audit:
  image:
    tag: dev
  resources:
    requests:
      cpu: 100m
      memory: 320Mi
    limits:
      # Un núcleo, igual que api y worker. Con 500m la JVM tardaba tanto en
      # arrancar que agotaba el startupProbe y el kubelet la reiniciaba en bucle.
      # Recortar CPU a un proceso Java penaliza sobre todo el arranque, que es
      # cuando más trabajo de compilación JIT y carga de clases hay.
      cpu: "1"
      memory: 320Mi

ui:
  image:
    tag: dev

# Un solo nodo: repartir entre nodos no significa nada aquí.
topologySpread:
  enabled: false

ingress:
  enabled: true
  className: nginx
  namespace: ingress-nginx
  # localtest.me resuelve a 127.0.0.1 sin tocar /etc/hosts.
  host: job-forge.localtest.me
