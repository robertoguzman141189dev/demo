# Values de job-forge en producción: el demo público, sobre el nodo k3s.
#
# Este archivo es el ÚNICO punto que el pipeline muta, y solo escribe image.tag
# (ADR 002). Todo lo demás se cambia a mano y con un commit revisable.

image:
  # Registro de ECR. Se deja vacío en el repositorio a propósito: la URL incluye
  # el número de cuenta de AWS, y este repositorio es público.
  #
  # Lo rellena el pipeline en su primera ejecución, junto al tag. Mientras esté
  # vacío, Argo CD marcará la Application como fallida al renderizar, que es el
  # comportamiento correcto: un despliegue sin saber de dónde sale la imagen no
  # debe adivinar.
  registry: "686420703561.dkr.ecr.us-east-1.amazonaws.com/"
  # Always y no IfNotPresent: los tags son inmutables y llevan el SHA del commit,
  # así que descargar siempre no cuesta nada —la capa ya está en el nodo si no
  # cambió— y elimina la posibilidad de que un nodo se quede con una versión
  # antigua.
  pullPolicy: Always

# El demo público corre sobre k3s, que no sabe cambiar el rol del nodo por un
# token de ECR. Un temporizador del propio nodo mantiene vivo este Secret,
# renovándolo cada seis horas porque el token dura doce. No hay ninguna credencial
# permanente en ningún sitio.
imagePullSecrets:
  - name: ecr-pull
# Un solo nodo. topologySpreadConstraints no se puede satisfacer y dejaría los
# pods en Pending; sobre EKS sí se enciende.
topologySpread:
  enabled: false
ingress:
  enabled: true
  className: nginx
  namespace: ingress-nginx
  # Sustituir por el dominio real cuando lo haya. Mientras tanto, la IP fija que
  # imprime terraform/aws-ec2-k3s resuelve igual con nip.io.
  host: job-forge.localtest.me
api:
  replicas: 1
  image:
    repository: event-lab/job-forge-api
    # Vacío: lo escribe el pipeline con el SHA del commit. Un despliegue sin tag
    # falla al renderizar en vez de desplegar algo arbitrario.
    tag: "db470634ed5c45e80760eae180e487ee5ce7adb8"
  resources:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      cpu: "1"
      memory: 384Mi
worker:
  # UNO, no dos, y es la restricción que manda en todo este archivo.
  #
  # Medido en kind: el despliegue completo pide unos 2,5 GiB solo en requests, y
  # el nodo del demo es una t4g.medium de 4 GiB compartidos con el propio k3s,
  # los dos brokers y el controlador de Ingress. El segundo worker no cabe.
  #
  # No se pierde nada de lo que el demo enseña: la inyección de fallos, el
  # backoff escalonado y la DLQ se ven igual con un consumidor. Lo único que no
  # se aprecia es el reparto entre consumidores compitiendo, y eso se demuestra
  # en el laboratorio de EKS, que sí tiene sitio.
  replicas: 1
  image:
    repository: event-lab/job-forge-worker
    tag: "db470634ed5c45e80760eae180e487ee5ce7adb8"
  resources:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      cpu: "1"
      memory: 384Mi
audit:
  replicas: 1
  image:
    repository: event-lab/job-forge-audit
    tag: "db470634ed5c45e80760eae180e487ee5ce7adb8"
  resources:
    requests:
      cpu: 100m
      memory: 320Mi
    limits:
      cpu: 500m
      memory: 320Mi
ui:
  replicas: 1
  image:
    repository: event-lab/job-forge-ui
    tag: "db470634ed5c45e80760eae180e487ee5ce7adb8"
