{{/*
Kafka en KRaft: un nodo con los dos papeles, broker y controller.

En producción los controllers son un número impar mayor o igual que 3, porque
mantienen por Raft el log de metadatos que antes vivía en ZooKeeper. Aquí es uno
solo: el objetivo es aprender a operarlo, no demostrar tolerancia a fallos que
nadie va a ejercitar en un demo.

Los tres listeners son el punto donde más gente se estrella, así que van
explicados:

  PLAINTEXT  (9092) clientes dentro del cluster
  CONTROLLER (9093) tráfico de Raft entre controllers

advertised.listeners es la dirección que el broker LE DICE al cliente que use, y
no tiene por qué ser aquella por la que el cliente llegó. Un cliente conecta al
Service, pide metadatos y a partir de ahí usa lo que el broker le conteste: si se
anunciara la IP del pod, cualquier reinicio dejaría a los clientes hablando con
una dirección muerta. Por eso se anuncia el nombre DNS del Service.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: platform
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: kafka
  ports:
    - name: controller
      port: 9093
      targetPort: controller

---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kafka
  ports:
    - name: plaintext
      port: 9092
      targetPort: plaintext

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: platform
spec:
  serviceName: kafka-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka
        app.kubernetes.io/part-of: platform
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.kafka.uid }}
        runAsGroup: {{ .Values.kafka.uid }}
        fsGroup: {{ .Values.kafka.uid }}
        seccompProfile:
          type: RuntimeDefault
      # Al apagarse, el broker cierra sus segmentos y cede el liderazgo de las
      # particiones. Cortarlo a la mitad no pierde datos —están en disco— pero
      # obliga a una recuperación del log al arrancar, que es lenta.
      terminationGracePeriodSeconds: 60
      containers:
        - name: kafka
          image: "{{ .Values.kafka.image.repository }}:{{ .Values.kafka.image.tag }}"
          imagePullPolicy: {{ .Values.kafka.image.pullPolicy }}
          ports:
            - name: plaintext
              containerPort: 9092
            - name: controller
              containerPort: 9093
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            - name: CLUSTER_ID
              value: {{ .Values.kafka.clusterId | quote }}
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@kafka-0.kafka-headless.{{ .Release.Namespace }}.svc.cluster.local:9093"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://:9092,CONTROLLER://:9093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka.{{ .Release.Namespace }}.svc.cluster.local:9092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: PLAINTEXT
            # Con un solo nodo no hay a quién replicar.
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_DEFAULT_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_MIN_INSYNC_REPLICAS
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            # Los topics se crean a propósito, con su número de particiones y su
            # política de retención (F3). Autocrearlos daría topics de una
            # partición y retención por defecto, justo lo contrario de lo que el
            # demo demuestra.
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "false"
            - name: KAFKA_LOG_DIRS
              value: /var/lib/kafka/data
            - name: KAFKA_HEAP_OPTS
              value: {{ .Values.kafka.heapOpts | quote }}
          # Formatear el directorio y arrancar la JVM lleva su tiempo; el
          # startupProbe lo cubre sin relajar las otras dos sondas después.
          startupProbe:
            tcpSocket:
              port: plaintext
            periodSeconds: 5
            failureThreshold: 36
          # "El puerto responde" no basta para un broker: esto le pregunta por sus
          # versiones de API, que es hablar el protocolo de verdad.
          #
          # Pero cada invocación arranca una JVM entera, igual que
          # rabbitmq-diagnostics arranca una VM de Erlang. Por eso el periodo es
          # de 30 segundos y no de 15: la sonda cara se paga la mitad de veces, y
          # el startupProbe de arriba —que es un tcpSocket y no cuesta nada— se
          # ocupa de todo el arranque, que es cuando el nodo va más justo.
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1
            periodSeconds: 30
            timeoutSeconds: 20
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: plaintext
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.kafka.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            capabilities:
              drop:
                - ALL
            # Misma excepción que en RabbitMQ y por el mismo motivo: la imagen
            # de Kafka reescribe su propia configuración al arrancar, fuera del
            # directorio de datos. Se deja visible en vez de disimulada.
            readOnlyRootFilesystem: false
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.kafka.storage.className }}
        storageClassName: {{ .Values.kafka.storage.className }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.kafka.storage.size }}

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: kafka
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: platform
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka
