{{- $component := "ui" -}}
{{- $svc := .Values.ui -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "job-forge.fullname" . }}-{{ $component }}
  labels:
    {{- include "job-forge.labels" (dict "root" . "component" $component) | nindent 4 }}
spec:
  replicas: {{ $svc.replicas }}
  selector:
    matchLabels:
      {{- include "job-forge.selectorLabels" (dict "root" . "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "job-forge.selectorLabels" (dict "root" . "component" $component) | nindent 8 }}
    spec:
      serviceAccountName: {{ include "job-forge.fullname" . }}-{{ $component }}
      # uid 101 y no 10001: este contenedor no es una JVM, es la imagen
      # nginx-unprivileged, que trae su propio usuario. El securityContext tiene
      # que decir el mismo uid que el Dockerfile o runAsNonRoot no cuadra.
      securityContext:
        {{- include "job-forge.podSecurityContext" (dict "uid" 101) | nindent 8 }}
      {{- include "job-forge.topologySpread" (dict "root" . "component" $component) | nindent 6 }}
      terminationGracePeriodSeconds: {{ $svc.terminationGracePeriodSeconds }}
      containers:
        - name: ui
          image: {{ include "job-forge.image" (dict "root" . "svc" $svc "component" $component) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          {{- if gt (int $svc.preStopSeconds) 0 }}
          lifecycle:
            preStop:
              sleep:
                seconds: {{ $svc.preStopSeconds }}
          {{- end }}
          # nginx sirve ficheros: arranca en milisegundos y las tres sondas
          # apuntan al mismo sitio. Aquí la distinción entre readiness y liveness
          # importa poco, y decirlo es más honesto que inventar una diferencia.
          #
          # Lo que sí importa es lo que /healthz NO mira: no consulta al API ni a
          # los brokers. Este pod entrega HTML y CSS, y sigue haciéndolo bien
          # aunque RabbitMQ esté caído. Atarlo a la salud del backend haría que
          # una caída del broker se llevara por delante hasta la pantalla que
          # explica que hay una caída.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 1
            failureThreshold: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
          securityContext:
            {{- include "job-forge.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            # nginx.conf manda su pid y todas sus rutas temporales a /tmp
            # justamente para poder tener la raíz en solo lectura.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
