{{/*
Un ServiceAccount por servicio, nunca el default.

No es burocracia: el ServiceAccount es el sujeto al que en EKS se le cuelga el
rol de IAM vía IRSA (F6). Compartir uno significa que todos los servicios acaban
con la unión de los permisos que necesita el más goloso.

Ninguno de los cuatro llama a la API de Kubernetes, así que no se les monta el
token. Un token montado sin usar es solo credencial que un atacante encuentra.
*/}}
{{- range $component := list "api" "worker" "audit" "ui" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "job-forge.fullname" $ }}-{{ $component }}
  labels:
    {{- include "job-forge.labels" (dict "root" $ "component" $component) | nindent 4 }}
  {{- with $.Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ $.Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
