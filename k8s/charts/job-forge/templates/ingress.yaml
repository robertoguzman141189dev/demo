{{- if .Values.ingress.enabled }}
{{/*
DOS Ingress y no uno, y el motivo es técnico: en ingress-nginx las anotaciones de
rate limiting se aplican al Ingress COMPLETO, no a una ruta suelta. Con un solo
objeto, el límite que protege a /api estrangularía también la carga de los
ficheros estáticos del panel —una primera visita son varias peticiones seguidas de
JS y CSS— y el panel tardaría en abrir o fallaría directamente.

Separados, cada uno lleva el límite que le corresponde:

  job-forge      -> el panel y el WebSocket. Generoso; son ficheros y una
                    conexión larga.
  job-forge-api  -> los endpoints que CREAN TRABAJO. Estricto.

El tope global por minuto, que es el que protege de muchas IP a la vez, no está
aquí: vive en el API (ver SubmissionBudget). Estas anotaciones frenan a una
persona insistiendo; aquello frena a cien repartidas.
*/}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "job-forge.fullname" . }}
  labels:
    {{- include "job-forge.labels" (dict "root" . "component" "ingress") | nindent 4 }}
  annotations:
    # El panel mantiene un WebSocket abierto para el tiempo real (ADR 006). Con
    # el timeout de lectura por defecto, el socket se cae cada minuto y el panel
    # parece parpadear sin motivo.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # Holgado: una primera visita descarga varios ficheros de golpe.
    # La ráfaga resultante es limit-rps × limit-burst-multiplier.
    nginx.ingress.kubernetes.io/limit-rps: {{ .Values.ingress.limits.panelRequestsPerSecond | quote }}
    nginx.ingress.kubernetes.io/limit-burst-multiplier: {{ .Values.ingress.limits.panelBurstMultiplier | quote }}
    nginx.ingress.kubernetes.io/limit-connections: {{ .Values.ingress.limits.panelConnections | quote }}
    nginx.ingress.kubernetes.io/limit-req-status-code: {{ .Values.ingress.limits.statusCode | quote }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # El WebSocket va al api, pero con los límites del panel: es una
          # conexión larga, no una ráfaga de peticiones, y contarla como si
          # creara trabajo cortaría el tiempo real.
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: {{ include "job-forge.fullname" . }}-api
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "job-forge.fullname" . }}-ui
                port:
                  name: http

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "job-forge.fullname" . }}-api
  labels:
    {{- include "job-forge.labels" (dict "root" . "component" "ingress") | nindent 4 }}
  annotations:
    # Aquí está el freno. Estos endpoints publican mensajes en las colas, así que
    # cada petición cuesta trabajo real al cluster.
    # Ráfaga = limit-rps × limit-burst-multiplier. Con 2 y 5 son diez peticiones
    # de golpe y luego dos por segundo: pulsar el botón varias veces no falla,
    # pero un bucle se topa con el límite enseguida.
    nginx.ingress.kubernetes.io/limit-rps: {{ .Values.ingress.limits.apiRequestsPerSecond | quote }}
    nginx.ingress.kubernetes.io/limit-burst-multiplier: {{ .Values.ingress.limits.apiBurstMultiplier | quote }}
    nginx.ingress.kubernetes.io/limit-connections: {{ .Values.ingress.limits.apiConnections | quote }}
    nginx.ingress.kubernetes.io/limit-req-status-code: {{ .Values.ingress.limits.statusCode | quote }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "job-forge.fullname" . }}-api
                port:
                  name: http
{{- end }}
