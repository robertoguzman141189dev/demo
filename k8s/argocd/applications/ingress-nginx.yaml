# El controlador de Ingress.
#
# Existe como Application porque el chart de job-forge declara un Ingress con
# ingressClassName: nginx, y sin controlador ese Ingress se queda creado y sin
# efecto: no da error, simplemente nadie atiende.
#
# En k3s hay que desplegarlo a mano porque el user_data desactiva Traefik, que es
# el que traía k3s por defecto. Dos controladores peleándose por el puerto 80 dan
# un fallo bastante opaco, así que se elige uno: el mismo que se probó en kind y
# el que llevará el rate limiting del endpoint público en F7.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: event-lab

  source:
    repoURL: https://kubernetes.github.io/ingress-nginx
    chart: ingress-nginx
    # Versión fijada, no un rango. Un controlador de Ingress que se actualiza
    # solo puede cambiar el comportamiento del enrutado sin que nadie toque el
    # repositorio, y eso es justo lo que GitOps existe para impedir.
    targetRevision: 4.14.1
    helm:
      values: |
        controller:
          # En k3s, el servicelb que trae de serie ata este Service a los puertos
          # 80 y 443 del nodo. Es lo que evita pagar un balanceador de AWS, que
          # costaria mas que la propia instancia.
          service:
            type: LoadBalancer
            # ESTO decide si el rate limiting por IP funciona o es decorativo.
            #
            # Con la politica por defecto (Cluster), kube-proxy puede reescribir la
            # IP de origen al reenviar entre nodos, y entonces nginx ve la IP del
            # nodo en vez de la del visitante. El limite por IP pasaria a agrupar a
            # TODO el mundo como un solo cliente: el primero que entre consume la
            # cuota de los demas.
            #
            # Con Local, la IP del cliente se conserva. La contrapartida habitual
            # —el trafico solo lo atiende el nodo donde hay un pod— aqui no existe:
            # hay un nodo.
            externalTrafficPolicy: Local
          # Una sola replica: es un nodo. Con dos, la segunda quedaria en Pending
          # por el antiafinidad y la Application nunca se pondria verde.
          replicaCount: 1
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 192Mi
          # El panel mantiene un WebSocket abierto para el tiempo real (ADR 006).
          # Con los timeouts por defecto el socket se cae cada minuto y el panel
          # parece parpadear sin motivo.
          config:
            proxy-read-timeout: "3600"
            proxy-send-timeout: "3600"
            # 429 y no el 503 que nginx devuelve por defecto al rechazar por
            # rate limiting. Un 503 dice "el servicio no esta disponible", que es
            # falso y manda al cliente a reintentar sin criterio; 429 dice "has
            # pedido demasiado", que es la verdad, y asi coincide con lo que
            # responde el tope global del API.
            #
            # OJO: esto va aqui, en el ConfigMap del controlador, y NO como
            # anotacion del Ingress. Es un ajuste global, no por Ingress, y
            # puesto como anotacion se ignora EN SILENCIO. Costo una prueba
            # descubrirlo: el limite frenaba correctamente pero devolvia 503.
            limit-req-status-code: "429"
            limit-conn-status-code: "429"
          # Sin metricas todavia: las enciende F7, junto con los dashboards.
          metrics:
            enabled: false

  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # El chart trae CRD y webhooks grandes; sin apply del lado del servidor,
      # algunos superan el límite de la anotación last-applied-configuration.
      - ServerSideApply=true
