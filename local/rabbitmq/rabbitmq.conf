# Configuración local de RabbitMQ. Solo para tu máquina.
# Aquí no se declara topología: exchanges, colas, TTL y DLX nacen en código con
# Spring AMQP en F1.

# ------------------------------------------------------------------ acceso ---
# Por defecto el usuario guest solo puede conectarse desde loopback. Al entrar
# por un puerto publicado de Docker, RabbitMQ ve la IP del gateway de la red del
# contenedor, no 127.0.0.1, y rechaza el login con un mensaje poco claro.
# Esto lo permite. Solo es aceptable porque este broker no sale de tu máquina:
# en el cluster las credenciales vienen de External Secrets.
loopback_users = none

# ----------------------------------------------------------------- métricas --
# rabbitmq_prometheus expone /metrics en el 15692. No hace falta ningún sidecar.
prometheus.tcp.port = 15692

# Métricas agregadas, no una serie por cola/conexión. Con pocas colas la
# diferencia es cosmética; con miles, la versión por objeto tumba a Prometheus.
prometheus.return_per_object_metrics = false

# -------------------------------------------------------------- estabilidad --
# Cuando el broker supera este porcentaje de la memoria disponible, aplica
# contrapresión y deja de aceptar publicaciones hasta que los consumidores se
# pongan al día. Es un mecanismo de defensa, no un error: si en F2 ves que el
# productor se bloquea, mira esto antes de culpar al código.
vm_memory_high_watermark.relative = 0.6

# Umbral de disco libre por debajo del cual también se bloquean las
# publicaciones. Las colas quorum persisten siempre a disco, así que este límite
# es más relevante aquí que con colas clásicas.
disk_free_limit.absolute = 1GB

# --------------------------------------------------------------- consumidor --
# Tiempo máximo que un consumidor puede tardar en acusar un mensaje antes de que
# el broker le cierre el canal por sospecha de bloqueo. El valor por defecto son
# 30 minutos. Se deja explícito y comentado porque en F2 vamos a jugar con
# tareas lentas a propósito, y este es el parámetro que decide si una tarea larga
# es "trabajo legítimo" o "worker colgado".
# consumer_timeout = 1800000

log.console.level = info
